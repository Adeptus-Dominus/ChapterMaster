name: opencode-issue-triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  triage:
    if: |
      (
        github.event_name == 'issues'
        && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        github.event_name == 'issue_comment'
        && !github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/triage')
        && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )

    concurrency:
      group: issue-${{ github.event.issue.number }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      issues: read

    steps:
      - name: Acknowledge Command
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
          GH_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions -f content='eyes'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Fetch Issue Context
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body > /tmp/issue_context.json

      - name: Prepare Triage Plan
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{ "external_directory": { "/home/runner/work/**": "allow", "/tmp/*": "allow" } }'
          OPENCODE_MAIN_MODEL: ${{ vars.OPENCODE_MAIN_MODEL }}
        run: |
          rm -f /tmp/triage_plan.json

          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            ALREADY_TRIAGED=$(gh issue view "$ISSUE_NUMBER" --json issueType --jq '.issueType.name // empty')
            if [ -n "$ALREADY_TRIAGED" ]; then
              echo "Issue #$ISSUE_NUMBER already triaged; re-running investigation only."
              echo '{"skip": true}' > /tmp/triage_plan.json
              exit 0
            fi
          fi

          ISSUE_TITLE=$(jq -r '.title // "No title"' /tmp/issue_context.json)
          ISSUE_BODY=$(jq -r '.body // "No description provided."' /tmp/issue_context.json)

          PROMPT="Issue #${ISSUE_NUMBER} opened at ${REPO}.

          Title: ${ISSUE_TITLE}

          Description:
          ---
          ${ISSUE_BODY}
          ---

          You are a read-only triage agent. Analyze the issue details above and prepare a triage plan.
          Do NOT execute any modifying GitHub commands.

          Perform the following triage analysis:
          1. Classify the issue type:
             - Available types: Bug, Feature, Task
          2. Assess priority based on severity:
             - Crash / Data loss / Blocker: 'Priority: Critical'
             - Major functionality broken (no workaround): 'Priority: High'
             - Minor issue or has a workaround: 'Priority: Medium'
             - Typo / Visual glitch / Cosmetic: 'Priority: Low'
          3. Check for duplicates:
             - Extract unique identifiers (error messages, function names, crash signatures) or core keywords.
             - Search for potential duplicates across all states:
               gh issue list --search '<keywords>' --state all --json number,title,state --limit 10
             - If a potential duplicate is found, inspect it to confirm using:
               gh issue view <candidate_number> --json title,body
             - Decide on exactly one duplicate action:
               - 'close': You are essentially certain (>= 95%) this issue duplicates an existing one. Set action to 'close', set canonical_issue to that issue's number, and formulate a closing comment (e.g., 'Closing as duplicate of #<number> - <reason/similarity summary>').
               - 'comment': You found a plausible duplicate but are not certain enough to close. Set action to 'comment', set canonical_issue to that issue's number, and formulate a notification comment (e.g., 'This issue might be a duplicate of #<number> - <similarity summary>').
               - 'nothing': No duplicate found. Set action to 'nothing', canonical_issue to null, and comment to null.
             - Rules:
               - Never use this issue itself (#${ISSUE_NUMBER}) as canonical_issue.
               - When action is 'close' or 'comment', a comment is mandatory.

          4. Output format:
             Write your final decision strictly as JSON into /tmp/triage_plan.json:
             {
               \"type\": \"<Bug|Feature|Task>\",
               \"priority_label\": \"<Priority: Critical|Priority: High|Priority: Medium|Priority: Low>\",
               \"duplicate\": {
                 \"action\": \"<close|comment|nothing>\",
                 \"canonical_issue\": <number|null>,
                 \"comment\": <string|null>
               }
             }

          Ensure the output in /tmp/triage_plan.json is valid raw JSON without Markdown code fences or extra text."

          opencode run -m ${OPENCODE_MAIN_MODEL} "$PROMPT"

      - name: Apply Triage Plan
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
          GH_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
        run: |
          if [ ! -f /tmp/triage_plan.json ]; then
            echo "::error::Triage plan /tmp/triage_plan.json was not generated."
            exit 1
          fi

          # Strip markdown code fences if present
          sed -i '/^```/d' /tmp/triage_plan.json

          if ! jq empty /tmp/triage_plan.json 2>/dev/null; then
            echo "::error::Triage plan is not valid JSON:"
            cat /tmp/triage_plan.json
            exit 1
          fi

          if [ "$(jq -r '.skip // false' /tmp/triage_plan.json)" = "true" ]; then
            echo "Triage skipped (comment re-run); nothing to apply."
            exit 0
          fi

          echo "=== Proposed Triage Plan ==="
          cat /tmp/triage_plan.json
          echo -e "\n============================"

          ISSUE_TYPE=$(jq -r '.type // empty' /tmp/triage_plan.json)
          PRIORITY=$(jq -r '.priority_label // empty' /tmp/triage_plan.json)
          DUP_ACTION=$(jq -r '.duplicate.action // "nothing"' /tmp/triage_plan.json | tr '[:upper:]' '[:lower:]')
          CANONICAL=$(jq -r '.duplicate.canonical_issue // empty' /tmp/triage_plan.json)
          DUP_COMMENT=$(jq -r '.duplicate.comment // empty' /tmp/triage_plan.json)

          # 1. Apply Issue Type
          case "$ISSUE_TYPE" in
            Bug|Feature|Task)
              echo "Applying issue type: $ISSUE_TYPE"
              gh issue edit "$ISSUE_NUMBER" --type "$ISSUE_TYPE" || echo "::warning::Failed to set issue type"
              ;;
            *)
              echo "No valid issue type specified ($ISSUE_TYPE); skipping."
              ;;
          esac

          # 2. Apply Priority Label
          case "$PRIORITY" in
            "Priority: Critical"|"Priority: High"|"Priority: Medium"|"Priority: Low")
              echo "Applying priority label: $PRIORITY"
              gh issue edit "$ISSUE_NUMBER" --add-label "$PRIORITY" || echo "::warning::Failed to add priority label"
              ;;
            *)
              echo "No valid priority label specified ($PRIORITY); skipping."
              ;;
          esac

          # 3. Handle Duplicate Logic
          CANONICAL="${CANONICAL#\#}" # Strip leading '#' if present

          # 'close'/'comment' require a valid canonical issue that is not this issue itself
          if [ "$DUP_ACTION" = "close" ] || [ "$DUP_ACTION" = "comment" ]; then
            if ! [[ "$CANONICAL" =~ ^[0-9]+$ ]] || [ "$CANONICAL" -eq "$ISSUE_NUMBER" ]; then
              echo "::warning::Duplicate action '$DUP_ACTION' requested but canonical_issue is invalid ('$CANONICAL'); skipping."
              DUP_ACTION="nothing"
            fi
          fi

          case "$DUP_ACTION" in
            close)
              echo "Closing issue #$ISSUE_NUMBER as duplicate of #$CANONICAL."
              CLOSE_BODY="${DUP_COMMENT:-"Closing as duplicate of #${CANONICAL}."}"
              gh issue close "$ISSUE_NUMBER" --reason duplicate --duplicate-of "$CANONICAL" --comment "$CLOSE_BODY"
              ;;
            comment)
              echo "Posting potential-duplicate notification to #$ISSUE_NUMBER (possibly a duplicate of #$CANONICAL)."
              NOTE_BODY="${DUP_COMMENT:-"This issue might be a duplicate of #${CANONICAL}."}"
              gh issue comment "$ISSUE_NUMBER" --body "$NOTE_BODY"
              ;;
            *)
              echo "No duplicate action required."
              ;;
          esac

      - name: Prepare Investigation
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{ "external_directory": { "/home/runner/work/**": "allow", "/tmp/*": "allow" } }'
          OPENCODE_MAIN_MODEL: ${{ vars.OPENCODE_MAIN_MODEL }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          rm -f /tmp/investigation.md

          # Skip if the issue was closed during triage (e.g. duplicate)
          ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)
          if [ "$ISSUE_STATE" = "CLOSED" ]; then
            echo "Skipping investigation - issue #$ISSUE_NUMBER is closed."
            exit 0
          fi

          # Skip if the issue is not classified as a Bug
          ISSUE_TYPE=$(gh issue view "$ISSUE_NUMBER" --json issueType --jq '.issueType.name // empty')
          if [ "$ISSUE_TYPE" != "Bug" ]; then
            echo "Skipping investigation - issue type is '$ISSUE_TYPE', not Bug."
            exit 0
          fi

          # Extract optional steering hint: everything after '/triage' in the
          # triggering comment. Empty for 'issues' (new issue) runs.
          HINT=""
          if [ -n "$COMMENT_BODY" ]; then
            HINT=$(printf '%s' "$COMMENT_BODY" | sed -e '1s|^/triage||' -e '1s|^[[:space:]]*||' -e '/./,$!d')
          fi

          HINT_BLOCK=""
          if [ -n "$HINT" ]; then
            echo "Maintainer hint provided (${#HINT} chars)."
            HINT_BLOCK="

          Maintainer Hint (trusted steering for this investigation):
          ---
          ${HINT}
          ---

          If a Maintainer Hint is present above, follow it and prioritize it over your own initial assumptions about where to look."
          fi

          ISSUE_TITLE=$(jq -r '.title // "No title"' /tmp/issue_context.json)
          ISSUE_BODY=$(jq -r '.body // "No description provided."' /tmp/issue_context.json)

          PROMPT="You are investigating Issue #${ISSUE_NUMBER} at ${REPO}.

          Title: ${ISSUE_TITLE}

          Description:
          ---
          ${ISSUE_BODY}
          ---
          ${HINT_BLOCK}

          Tasks:
          1. Inspect and read the repository codebase to locate the root cause.
          2. Propose solution(s)/fix(es).
          3. Write your full markdown investigation report and proposed fixes to /tmp/investigation.md.

          Rules:
          - Reference files like so: https://github.com/Adeptus-Dominus/ChapterMaster/blob/main/scripts/DebugView/DebugView.gml.
          - Reference specific code lines (or ranges) like so: https://github.com/Adeptus-Dominus/ChapterMaster/blob/main/scripts/DebugView/DebugView.gml#L24 (or #L24-L28 for a range).
          - Do NOT execute any modifying GitHub commands. Only write the file /tmp/investigation.md."

          opencode run -m ${OPENCODE_MAIN_MODEL} "$PROMPT"

      - name: Post Investigation Comment
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
          GH_TOKEN: ${{ secrets.LYRA_PRS_ISSUES_PAT }}
        run: |
          if [ -s /tmp/investigation.md ]; then
            echo "Posting investigation findings to issue #${ISSUE_NUMBER}..."
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/investigation.md
          else
            echo "No investigation report generated; skipping comment."
          fi
