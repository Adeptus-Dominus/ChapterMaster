name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task'
        required: true

jobs:
  opencode:
    if: |
      ((github.event_name == 'issue_comment'
          || github.event_name == 'pull_request_review_comment')
        && (startsWith(github.event.comment.body, '/oc')
          || startsWith(github.event.comment.body, '/opencode'))
        && contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.30
        env:
          GITHUB_TOKEN: ${{ secrets.LYRA_CONTENTS_PRS_ISSUES_PAT }}
          GH_TOKEN: ${{ secrets.LYRA_CONTENTS_PRS_ISSUES_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{ "external_directory": { "*": "deny", "/home/runner/work/**": "allow" }, "doom_loop": deny }'
        with:
          use_github_token: true
          model: ${{ vars.OPENCODE_MAIN_MODEL }}
          variant: xhigh
          share: false
          prompt: ${{ inputs.prompt || '' }}
