name: "Mark stale issues and PRs"
on:
  schedule:
    - cron: '0 22 * * *'  # every day at 22:00 UTC

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: "This pull request is marked as stale; 14 days without activity."
          stale-issue-message: "This issue is marked as stale; 14 days without activity."
          only-issue-types: "bug"
          days-before-stale: 14
          days-before-close: -1
          stale-pr-label: "Status: Stale"
          stale-issue-label: "Status: Stale"
